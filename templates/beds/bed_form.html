{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<form method="post" class="form-grid">{% csrf_token %}
    {% for field in form %}<div class="form-field"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<span class="form-error">{{ field.errors|striptags }}</span>{% endif %}</div>{% endfor %}
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{% url 'beds:bed_list' %}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
