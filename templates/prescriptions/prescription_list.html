{% extends "base.html" %}

{% block title %}Prescriptions{% endblock %}
{% block page_title %}Prescriptions{% endblock %}

{% block topbar_actions %}
<a href="{% url 'prescriptions:prescription_create' %}" class="btn btn-primary btn-sm">+ New Prescription</a>
{% endblock %}

{% block content %}
<div class="toolbar">
    <div class="search-box">
        <input type="text" name="search" placeholder="Search by patient or diagnosis..."
               value="{{ search }}"
               hx-get="{% url 'prescriptions:prescription_list' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#prescription-table">
    </div>
</div>

<div id="prescription-table">
    {% include "prescriptions/partials/prescription_table.html" %}
</div>
{% endblock %}
