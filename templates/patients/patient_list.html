{% extends "base.html" %}

{% block title %}Patients{% endblock %}
{% block page_title %}Patients{% endblock %}

{% block topbar_actions %}
<a href="{% url 'patients:patient_create' %}" class="btn btn-primary btn-sm">+ Register Patient</a>
{% endblock %}

{% block content %}
<div class="toolbar">
    <div class="search-box">
        <input type="text" name="search" placeholder="Search by name or phone..."
               value="{{ search }}"
               hx-get="{% url 'patients:patient_list' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#patient-table"
               hx-include="[name='blood_group']">
    </div>
    <select name="blood_group" class="filter-select"
            hx-get="{% url 'patients:patient_list' %}"
            hx-trigger="change"
            hx-target="#patient-table"
            hx-include="[name='search']">
        <option value="">All Blood Groups</option>
        {% for val, label in blood_groups %}
        <option value="{{ val }}" {% if blood_group == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>

<div id="patient-table">
    {% include "patients/partials/patient_table.html" %}
</div>
{% endblock %}
