{% extends "base.html" %}

{% block title %}Delete {{ type }}{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card confirm-card">
    <h2><i data-lucide="alert-triangle" style="width:20px;height:20px;color:var(--warning);"></i> Delete {{ type }}</h2>
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'core:user_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
